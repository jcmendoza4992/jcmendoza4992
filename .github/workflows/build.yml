name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk VoicePilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoicePilot-apk
          path: VoicePilot.apk
      - name: Publish release with direct APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" VoicePilot.apk --title "VoicePilot build ${{ github.run_number }}" --notes "Install VoicePilot.apk on your phone."
